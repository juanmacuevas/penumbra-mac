<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Penumbra app icon ("Eclipse"). macOS grid: 824 px body centred on a 1024 canvas. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262d58"/>
      <stop offset="1" stop-color="#0a0c1a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.36" cy="0.66" r="0.75">
      <stop offset="0" stop-color="#fff4d1"/>
      <stop offset="0.45" stop-color="#ffb84d"/>
      <stop offset="1" stop-color="#ff5e3a"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e2448"/>
      <stop offset="1" stop-color="#0c0e1f"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.14"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#body)"><g transform="translate(100 100) scale(8.24)">
    <circle cx="46" cy="54" r="38" fill="url(#glow)"/>
    <circle cx="46" cy="54" r="24" fill="url(#sun)"/>
    <circle cx="57" cy="44" r="22" fill="url(#moon)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="0.6"/></g>
  </g>
  <rect x="105" y="105" width="814" height="814" rx="181" fill="none" stroke="url(#rim)" stroke-width="10"/>
</svg>
